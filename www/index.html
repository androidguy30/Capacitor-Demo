<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="HandheldFriendly" content="true">
  <title>Super Mario Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -ms-touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      -webkit-touch-callout: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <iframe
    id="webview"
    src="https://super-mario-demo-eight.vercel.app/"
    allow="fullscreen; autoplay"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
  ></iframe>
  <script>
    // Disable context menu (long-press menu) globally
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    }, { capture: true });

    // Also attach directly to the iframe element
    const iframe = document.getElementById('webview');
    if (iframe) {
      iframe.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      }, { capture: true });
    }

    // Disable zoom gestures
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

    // Disable pinch-to-zoom via touch events
    document.addEventListener('touchstart', function(e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('touchmove', function(e) {
      if (e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // Disable double-tap zoom
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    // Disable ctrl+scroll zoom (keyboard zoom)
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=')) {
        e.preventDefault();
      }
    });

    document.addEventListener('wheel', function(e) {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
